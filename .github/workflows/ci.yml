name: Build, Test and Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore LANShareManager.sln

    - name: Build solution
      run: dotnet build LANShareManager.sln -c Release --no-restore

    - name: Run unit tests
      run: dotnet test tests/LANShareManager.Tests/LANShareManager.Tests.csproj -c Release --no-build --verbosity normal

    - name: Publish GUI (win-x64)
      run: dotnet publish src/LANShareManager.App/LANShareManager.App.csproj -c Release -r win-x64 --self-contained false -o ./dist/

    - name: Publish CLI (win-x64)
      run: dotnet publish src/LANShareManager.CLI/LANShareManager.CLI.csproj -c Release -r win-x64 --self-contained false -o ./dist/

    - name: Compress Distribution Package
      shell: pwsh
      run: |
        Compress-Archive -Path ./dist/* -DestinationPath ./LANShareManager-v1.0.0-win-x64.zip -Force
        $hash = (Get-FileHash ./LANShareManager-v1.0.0-win-x64.zip -Algorithm SHA256).Hash
        Write-Host "PACKAGE_SHA256: $hash"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LANShareManager-win-x64
        path: ./LANShareManager-v1.0.0-win-x64.zip

    - name: Update GitHub Release Asset
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload v1.0.0 ./LANShareManager-v1.0.0-win-x64.zip --clobber

