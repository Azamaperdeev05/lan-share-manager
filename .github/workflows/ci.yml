name: Build, Test and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore LANShareManager.sln

    - name: Build solution
      run: dotnet build LANShareManager.sln -c Release --no-restore

    - name: Run unit tests
      run: dotnet test tests/LANShareManager.Tests/LANShareManager.Tests.csproj -c Release --no-build --verbosity normal

    - name: Publish GUI (win-x64)
      run: dotnet publish src/LANShareManager.App/LANShareManager.App.csproj -c Release -r win-x64 --self-contained false -o ./dist/

    - name: Publish CLI (win-x64)
      run: dotnet publish src/LANShareManager.CLI/LANShareManager.CLI.csproj -c Release -r win-x64 --self-contained false -o ./dist/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LANShareManager-win-x64
        path: ./dist/
